spring.application.name=config-server
server.port=8888


spring.cloud.config.server.git.uri=https://github.com/deepamunesh/his-infra-config.git
spring.cloud.config.server.git.default-label=develop
spring.cloud.config.server.git.clone-on-start=true
spring.cloud.config.server.git.timeout=30


# GitHub credentials injected via environment variables
spring.cloud.config.server.git.username=${GITHUB_USER}
spring.cloud.config.server.git.password=${GITHUB_TOKEN}

# Eureka client configs
eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true